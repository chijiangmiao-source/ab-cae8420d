# 精确实根隔离页面：app 提供网页服务，verify 运行测试/构建/冒烟后以退出码退出。
# 端口通过 APP_PORT 环境变量配置（默认 8080）：
#   APP_PORT=9090 docker compose up app
#   docker compose up --exit-code-from verify verify

services:
  app:
    build:
      context: .
      target: runtime
    image: sturm-isolation-app
    environment:
      PORT: ${APP_PORT:-8080}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: sturm-isolation-verify
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:${APP_PORT:-8080}
